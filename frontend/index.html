<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - Newen Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Librería para generar Códigos QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="max-w-7xl mx-auto p-4 md:p-8">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 border-b pb-4">
            <h1 class="text-3xl font-bold text-gray-900">👗 Newen Store - Inventario</h1>
            <span class="text-sm bg-emerald-100 text-emerald-800 font-semibold px-3 py-1 rounded-full mt-2 md:mt-0">Backend Conectado (Render)</span>
        </header>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
            <!-- Columna Izquierda: Formularios -->
            <div class="space-y-6">
                <!-- Formulario Prenda -->
                <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100 h-fit">
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex items-center gap-2 select-none">
                            <span class="bg-indigo-100 text-indigo-700 p-1.5 rounded-lg font-bold text-sm">📦</span>
                            <h2 id="tituloFormulario" class="text-xl font-semibold text-gray-700">Detalle de Prenda</h2>
                        </div>
                        <!-- Botones de Acción Superior (Nuevo / Editar / QR Venta / QR Anular / Borrar) -->
                        <div class="flex gap-1 flex-wrap justify-end">
                            <button type="button" id="btnNuevoIngreso" onclick="habilitarNuevoIngreso()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold px-2 py-1.5 rounded-lg transition items-center gap-1 shadow-sm">
                                ➕ Nuevo
                            </button>
                            <button type="button" id="btnHabilitarEdicion" onclick="habilitarEdicionActual()" class="hidden bg-amber-500 hover:bg-amber-600 text-white text-[11px] font-bold px-2 py-1.5 rounded-lg transition items-center gap-1 shadow-sm">
                                ✏️ Editar
                            </button>
                            <button type="button" id="btnVerQr" onclick="abrirQrActual()" class="hidden bg-purple-600 hover:bg-purple-700 text-white text-[11px] font-bold px-2 py-1.5 rounded-lg transition items-center gap-1 shadow-sm" title="Ver código QR para Vender">
                                📱 QR Venta
                            </button>
                            <button type="button" id="btnVerQrAnular" onclick="abrirQrAnularActual()" class="hidden bg-pink-600 hover:bg-pink-700 text-white text-[11px] font-bold px-2 py-1.5 rounded-lg transition items-center gap-1 shadow-sm" title="Ver código QR para Anular Venta">
                                📱 QR Anular
                            </button>
                            <button type="button" id="btnBorrarPrenda" onclick="borrarPrendaActual()" class="hidden bg-red-600 hover:bg-red-700 text-white text-[11px] font-bold px-2 py-1.5 rounded-lg transition items-center gap-1 shadow-sm">
                                🗑️ Borrar
                            </button>
                        </div>
                    </div>
                    
                    <form id="formPrenda" class="space-y-4">
                        <input type="hidden" id="prendaId">
                        <!-- Cuadro de Código Visible Arriba -->
                        <div id="contenedorCodigoDisplay" class="hidden bg-indigo-50 border border-indigo-200 p-3 rounded-lg text-center">
                            <span class="block text-xs font-bold text-indigo-500 uppercase tracking-wider">Código de la Prenda</span>
                            <span id="codigoDisplay" class="text-lg font-black text-indigo-700 tracking-wide">---</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-sm font-medium text-gray-600">Cantidad *</label>
                                <select id="cantidad" disabled required class="w-full mt-1 p-2 border rounded-lg bg-gray-100 text-gray-500 outline-none">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                    <option value="9">9</option>
                                    <option value="10">10</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-600">Unidad de Medida *</label>
                                <select id="unidadSelect" disabled required class="w-full mt-1 p-2 border rounded-lg bg-gray-100 text-gray-500 outline-none">
                                    <option value="" disabled selected>Selecciona unidad</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600">Nombre / Descripción *</label>
                            <input type="text" id="nombre" disabled required class="w-full mt-1 p-2 border rounded-lg bg-gray-100 text-gray-500 outline-none" placeholder="Ej. Camiseta Oversize">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-sm font-medium text-gray-600">Marca *</label>
                                <select id="marcaSelect" disabled required class="w-full mt-1 p-2 border rounded-lg bg-gray-100 text-gray-500 outline-none">
                                    <option value="" disabled selected>Selecciona marca</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-600">Género *</label>
                                <select id="genero" disabled required class="w-full mt-1 p-2 border rounded-lg bg-gray-100 text-gray-500 outline-none">
                                    <option value="" disabled selected>Selecciona</option>
                                    <option value="Mujer">Mujer</option>
                                    <option value="Hombre">Hombre</option>
                                    <option value="Unisex">Unisex</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-sm font-medium text-gray-600">Categoría *</label>
                                <select id="categoriaSelect" disabled required class="w-full mt-1 p-2 border rounded-lg bg-gray-100 text-gray-500 outline-none">
                                    <option value="" disabled selected>Selecciona categoría</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-600">Talla *</label>
                                <select id="tallaSelect" disabled required class="w-full mt-1 p-2 border rounded-lg bg-gray-100 text-gray-500 outline-none">
                                    <option value="" disabled selected>Selecciona talla</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-sm font-medium text-gray-600">Costo ($) *</label>
                                <input type="number" id="costo" disabled required class="w-full mt-1 p-2 border rounded-lg bg-gray-100 text-gray-500 outline-none" placeholder="Ej. 5000">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-600">Precio Venta ($) *</label>
                                <input type="number" id="precio" disabled required class="w-full mt-1 p-2 border rounded-lg bg-gray-100 text-gray-500 outline-none" placeholder="Ej. 8000">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600">Estado *</label>
                            <select id="estado" disabled required class="w-full mt-1 p-2 border rounded-lg bg-gray-100 text-gray-500 outline-none">
                                <option value="" disabled selected>Selecciona</option>
                                <option value="Nuevo con etiqueta">Nuevo con etiqueta</option>
                                <option value="Usado - Excelente estado">Usado - Excelente estado</option>
                                <option value="Usado - Buen estado">Usado - Buen estado</option>
                                <option value="Usado - Con detalles">Usado - Con detalles</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600">Comentarios / Observaciones <span class="text-gray-400 font-normal">(Opcional)</span></label>
                            <textarea id="comentario" disabled rows="2" class="w-full mt-1 p-2 border rounded-lg bg-gray-100 text-gray-500 outline-none text-sm" placeholder="Ej. Detalle mínimo en la costura"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-600">Foto de la Prenda</label>
                            <div id="previewMiniaturaContainer" class="hidden mt-2 mb-2">
                                <img id="imgFormPreview" src="" alt="Vista previa" onclick="abrirModalImagen(this.src)" class="h-24 w-auto rounded-lg border cursor-pointer hover:opacity-90 object-contain bg-gray-50 shadow-xs" title="Clic para ver imagen completa">
                            </div>
                            <input type="file" id="imagenFile" disabled accept="image/*" class="w-full mt-1 p-2 border rounded-lg bg-gray-100 text-gray-400 text-sm file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-gray-200 file:text-gray-500">
                        </div>
                        <div class="space-y-2 pt-2">
                            <button type="submit" id="btnGuardar" class="hidden w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold p-2.5 rounded-lg transition">Guardar Prenda</button>
                            <button type="button" id="btnActualizar" onclick="actualizarPrenda()" class="hidden w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold p-2.5 rounded-lg transition">Actualizar Prenda</button>
                            <button type="button" id="btnCancelar" onclick="cancelarEdicion()" class="hidden w-full bg-gray-400 hover:bg-gray-500 text-white font-semibold p-2.5 rounded-lg transition">Cancelar</button>
                        </div>
                    </form>
                </div>
                <!-- Panel de Gestión de Marcas -->
                <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                    <h2 class="text-lg font-semibold mb-3 text-gray-700">🏷️ Administrar Marcas</h2>
                    <form id="formMarca" class="flex gap-2 mb-3">
                        <input type="text" id="nuevaMarcaNombre" required placeholder="Nueva marca..." class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition">Agregar</button>
                    </form>
                    <div id="listaMarcasGestion" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto p-1 border rounded-lg bg-gray-50"></div>
                </div>
                <!-- Panel de Gestión de Categorías -->
                <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                    <h2 class="text-lg font-semibold mb-3 text-gray-700">📂 Administrar Categorías</h2>
                    <form id="formCategoria" class="flex gap-2 mb-3">
                        <input type="text" id="nuevaCategoriaNombre" required placeholder="Nueva categoría..." class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition">Agregar</button>
                    </form>
                    <div id="listaCategoriasGestion" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto p-1 border rounded-lg bg-gray-50"></div>
                </div>
                <!-- Panel de Gestión de Tallas -->
                <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                    <h2 class="text-lg font-semibold mb-3 text-gray-700">📏 Administrar Tallas</h2>
                    <form id="formTalla" class="flex gap-2 mb-3">
                        <input type="text" id="nuevaTallaNombre" required placeholder="Nueva talla..." class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition">Agregar</button>
                    </form>
                    <div id="listaTallasGestion" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto p-1 border rounded-lg bg-gray-50"></div>
                </div>
                <!-- Panel de Gestión de Unidades de Medida -->
                <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                    <h2 class="text-lg font-semibold mb-3 text-gray-700">⚖️ Administrar Unidades</h2>
                    <form id="formUnidad" class="flex gap-2 mb-3">
                        <input type="text" id="nuevaUnidadNombre" required placeholder="Nueva unidad..." class="w-full p-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition">Agregar</button>
                    </form>
                    <div id="listaUnidadesGestion" class="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto p-1 border rounded-lg bg-gray-50"></div>
                </div>
            </div>
            <!-- Columna Derecha: Buscador, Filtros y Listado -->
            <div class="lg:col-span-2 space-y-4">
                <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
                    <h2 class="text-xl font-semibold text-gray-700">📦 Prendas en Inventario</h2>
                    <input type="text" id="inputBuscar" placeholder="🔍 Buscar por código, nombre o marca..." class="w-full md:w-72 p-2 border rounded-lg bg-white shadow-sm text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <!-- Botones de Filtro rápido -->
                <div class="flex flex-wrap gap-2 pt-1">
                    <button onclick="filtrarEstado('todos')" class="filtro-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition">Todas</button>
                    <button onclick="filtrarEstado('disponibles')" class="filtro-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300 transition">Disponibles</button>
                    <button onclick="filtrarEstado('vendidos')" class="filtro-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300 transition">Vendidos</button>
                </div>
                <div id="contenedorPrendas" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 pt-2">
                </div>
            </div>
        </div>
    </div>
    <!-- MODAL PARA VER IMAGEN GRANDE -->
    <div id="modalImagen" class="fixed inset-0 z-50 hidden bg-black/80 flex items-center justify-center p-4" onclick="cerrarModalImagen()">
        <div class="relative max-w-4xl max-h-[90vh] bg-white rounded-xl overflow-hidden shadow-2xl p-2" onclick="event.stopPropagation()">
            <button onclick="cerrarModalImagen()" class="absolute top-3 right-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-full w-8 h-8 flex items-center justify-center text-sm shadow-md transition z-10">✕</button>
            <img id="imagenModalAmpliada" src="" alt="Imagen ampliada" class="max-w-full max-h-[80vh] object-contain mx-auto rounded-lg">
        </div>
    </div>
    <!-- MODAL PARA VER CÓDIGO QR GRANDE -->
    <div id="modalQr" class="fixed inset-0 z-50 hidden bg-black/80 flex items-center justify-center p-4" onclick="cerrarModalQr()">
        <div class="relative bg-white rounded-2xl overflow-hidden shadow-2xl p-6 text-center max-w-xs w-full" onclick="event.stopPropagation()">
            <button onclick="cerrarModalQr()" class="absolute top-3 right-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-full w-7 h-7 flex items-center justify-center text-xs transition">✕</button>
            <h3 id="qrTituloPrenda" class="font-bold text-gray-800 text-base mb-1">Código QR de Venta</h3>
            <p id="qrSubtitulo" class="text-xs text-gray-400 mb-4">Escanea con tu celular para vender</p>
            <div id="qrGeneradoModal" class="bg-gray-50 p-4 border rounded-xl flex items-center justify-center mb-4"></div>
            <p id="qrTextoCodigo" class="text-xs font-mono font-bold text-indigo-600 bg-indigo-50 py-1.5 px-3 rounded-lg border border-indigo-100"></p>
        </div>
    </div>
    <script>
        const BASE_URL = '';
        const API_URL = `${BASE_URL}/prendas`;
        const API_MARCAS = `${BASE_URL}/marcas`;
        const API_CATEGORIAS = `${BASE_URL}/categorias`;
        const API_TALLAS = `${BASE_URL}/tallas`;
        const API_UNIDADES = `${BASE_URL}/unidades`;
        let listaGlobalPrendas = [];
        let filtroActual = 'todos';
        async function inicializar() {
            await cargarMarcas();
            await cargarCategorias();
            await cargarTallas();
            await cargarUnidades();
            await obtenerPrendas();
        }
        async function cargarMarcas() {
            try {
                const res = await fetch(API_MARCAS);
                const marcas = await res.json();
                const selectMarca = document.getElementById('marcaSelect');
                const contenedorGestion = document.getElementById('listaMarcasGestion');
                
                selectMarca.innerHTML = '<option value="" disabled selected>Selecciona marca</option>';
                contenedorGestion.innerHTML = marcas.length === 0 ? '<span class="text-xs text-gray-400 p-1">No hay marcas.</span>' : '';
                marcas.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.nombre; opt.textContent = m.nombre;
                    selectMarca.appendChild(opt);
                    const tag = document.createElement('div');
                    tag.className = 'flex items-center gap-1 bg-white border px-2 py-1 rounded text-xs shadow-xs';
                    tag.innerHTML = `<span>${m.nombre}</span> <button type="button" onclick="eliminarMarca('${m._id}')" class="text-red-500 font-bold hover:text-red-700 ml-1">×</button>`;
                    contenedorGestion.appendChild(tag);
                });
            } catch (err) { console.error("Error al cargar marcas", err); }
        }
        document.getElementById('formMarca').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nuevaMarcaNombre').value.trim();
            if (!nombre) return;
            const res = await fetch(API_MARCAS, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre })
            });
            if (res.ok) { document.getElementById('nuevaMarcaNombre').value = ''; cargarMarcas(); }
            else { const data = await res.json(); alert(data.error || 'Error al agregar marca.'); }
        });
        async function eliminarMarca(id) {
            if (!confirm('¿Eliminar esta marca?')) return;
            const res = await fetch(`${API_MARCAS}/${id}`, { method: 'DELETE' });
            if (res.ok) cargarMarcas();
        }
        async function cargarCategorias() {
            try {
                const res = await fetch(API_CATEGORIAS);
                const categorias = await res.json();
                const selectCat = document.getElementById('categoriaSelect');
                const contenedorGestion = document.getElementById('listaCategoriasGestion');
                
                selectCat.innerHTML = '<option value="" disabled selected>Selecciona categoría</option>';
                contenedorGestion.innerHTML = categorias.length === 0 ? '<span class="text-xs text-gray-400 p-1">No hay categorías.</span>' : '';
                categorias.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.nombre; opt.textContent = c.nombre;
                    selectCat.appendChild(opt);
                    const tag = document.createElement('div');
                    tag.className = 'flex items-center gap-1 bg-white border px-2 py-1 rounded text-xs shadow-xs';
                    tag.innerHTML = `<span>${c.nombre}</span> <button type="button" onclick="eliminarCategoria('${c._id}')" class="text-red-500 font-bold hover:text-red-700 ml-1">×</button>`;
                    contenedorGestion.appendChild(tag);
                });
            } catch (err) { console.error("Error al cargar categorías", err); }
        }
        document.getElementById('formCategoria').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nuevaCategoriaNombre').value.trim();
            if (!nombre) return;
            const res = await fetch(API_CATEGORIAS, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre })
            });
            if (res.ok) { document.getElementById('nuevaCategoriaNombre').value = ''; cargarCategorias(); }
            else { const data = await res.json(); alert(data.error || 'Error al agregar categoría.'); }
        });
        async function eliminarCategoria(id) {
            if (!confirm('¿Eliminar esta categoría?')) return;
            const res = await fetch(`${API_CATEGORIAS}/${id}`, { method: 'DELETE' });
            if (res.ok) cargarCategorias();
        }
        async function cargarTallas() {
            try {
                const res = await fetch(API_TALLAS);
                const tallas = await res.json();
                const selectTalla = document.getElementById('tallaSelect');
                const contenedorGestion = document.getElementById('listaTallasGestion');
                
                selectTalla.innerHTML = '<option value="" disabled selected>Selecciona talla</option>';
                contenedorGestion.innerHTML = tallas.length === 0 ? '<span class="text-xs text-gray-400 p-1">No hay tallas.</span>' : '';
                tallas.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t.nombre; opt.textContent = t.nombre;
                    selectTalla.appendChild(opt);
                    const tag = document.createElement('div');
                    tag.className = 'flex items-center gap-1 bg-white border px-2 py-1 rounded text-xs shadow-xs';
                    tag.innerHTML = `<span>${t.nombre}</span> <button type="button" onclick="eliminarTalla('${t._id}')" class="text-red-500 font-bold hover:text-red-700 ml-1">×</button>`;
                    contenedorGestion.appendChild(tag);
                });
            } catch (err) { console.error("Error al cargar tallas", err); }
        }
        document.getElementById('formTalla').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nuevaTallaNombre').value.trim();
            if (!nombre) return;
            const res = await fetch(API_TALLAS, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre })
            });
            if (res.ok) { document.getElementById('nuevaTallaNombre').value = ''; cargarTallas(); }
            else { const data = await res.json(); alert(data.error || 'Error al agregar talla.'); }
        });
        async function eliminarTalla(id) {
            if (!confirm('¿Eliminar esta talla?')) return;
            const res = await fetch(`${API_TALLAS}/${id}`, { method: 'DELETE' });
            if (res.ok) cargarTallas();
        }
        async function cargarUnidades() {
            try {
                const res = await fetch(API_UNIDADES);
                const unidades = await res.json();
                const selectUnidad = document.getElementById('unidadSelect');
                const contenedorGestion = document.getElementById('listaUnidadesGestion');
                
                selectUnidad.innerHTML = '<option value="" disabled selected>Selecciona unidad</option>';
                contenedorGestion.innerHTML = unidades.length === 0 ? '<span class="text-xs text-gray-400 p-1">No hay unidades.</span>' : '';
                unidades.forEach(u => {
                    const opt = document.createElement('option');
                    opt.value = u.nombre; opt.textContent = u.nombre;
                    selectUnidad.appendChild(opt);
                    const tag = document.createElement('div');
                    tag.className = 'flex items-center gap-1 bg-white border px-2 py-1 rounded text-xs shadow-xs';
                    tag.innerHTML = `<span>${u.nombre}</span> <button type="button" onclick="eliminarUnidad('${u._id}')" class="text-red-500 font-bold hover:text-red-700 ml-1">×</button>`;
                    contenedorGestion.appendChild(tag);
                });
            } catch (err) { console.error("Error al cargar unidades", err); }
        }
        document.getElementById('formUnidad').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nuevaUnidadNombre').value.trim();
            if (!nombre) return;
            const res = await fetch(API_UNIDADES, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ nombre })
            });
            if (res.ok) { document.getElementById('nuevaUnidadNombre').value = ''; cargarUnidades(); }
            else { const data = await res.json(); alert(data.error || 'Error al agregar unidad.'); }
        });
        async function eliminarUnidad(id) {
            if (!confirm('¿Eliminar esta unidad?')) return;
            const res = await fetch(`${API_UNIDADES}/${id}`, { method: 'DELETE' });
            if (res.ok) cargarUnidades();
        }
        async function obtenerPrendas() {
            try {
                const res = await fetch(API_URL);
                listaGlobalPrendas = await res.json();
                aplicarFiltros();
            } catch (error) {
                console.error("Error al cargar inventario:", error);
                document.getElementById('contenedorPrendas').innerHTML = '<p class="text-red-500">Error al conectar con el servidor backend.</p>';
            }
        }
        function aplicarFiltros() {
            const textoBusqueda = document.getElementById('inputBuscar').value.toLowerCase();
            const contenedor = document.getElementById('contenedorPrendas');
            contenedor.innerHTML = '';
            
            const prendasFiltradas = listaGlobalPrendas.filter(prenda => {
                const coincideTexto = (prenda.codigo && prenda.codigo.toLowerCase().includes(textoBusqueda)) ||
                                     prenda.nombre.toLowerCase().includes(textoBusqueda) ||
                    (prenda.marca && prenda.marca.toLowerCase().includes(textoBusqueda)) ||
                                     (prenda.genero && prenda.genero.toLowerCase().includes(textoBusqueda)) ||
                    prenda.categoria.toLowerCase().includes(textoBusqueda) ||
                                     prenda.talla.toLowerCase().includes(textoBusqueda);
                
                if (filtroActual === 'disponibles') return !prenda.vendido && coincideTexto;
                if (filtroActual === 'vendidos') return prenda.vendido && coincideTexto;
                return coincideTexto;
            });
            if (prendasFiltradas.length === 0) {
                contenedor.innerHTML = '<p class="text-gray-500 col-span-3 py-8 text-center">No se encontraron prendas con esos criterios.</p>';
                return;
            }
            prendasFiltradas.forEach(prenda => {
                const tarjeta = document.createElement('div');
                tarjeta.className = `bg-white rounded-xl shadow-md overflow-hidden border cursor-pointer hover:shadow-lg transition ${prenda.vendido ? 'border-red-200 bg-red-50/30' : 'border-gray-100'}`;
                tarjeta.onclick = () => mostrarDatosBloqueados(prenda);
                
                const seccionComentario = prenda.comentario ? `
                    <div class="mt-2 p-1.5 bg-amber-50 border border-amber-100 rounded-lg text-xs text-amber-800">
                        <span class="font-semibold">Nota:</span> ${prenda.comentario}
                    </div>
                ` : '';
                tarjeta.innerHTML = `
                    <div class="relative w-full h-48 bg-gray-50 flex items-center justify-center overflow-hidden border-b">
                        <img src="${prenda.imagen}" alt="${prenda.nombre}" onclick="event.stopPropagation(); abrirModalImagen('${prenda.imagen}')" class="w-full h-full object-contain cursor-zoom-in p-1" title="Haz clic para ver imagen completa">
                        <span class="absolute top-2 left-2 px-2 py-0.5 text-[10px] font-bold bg-black/70 text-white rounded-full">
                            Cod: ${prenda.codigo}
                        </span>
                        <span class="absolute top-2 right-2 px-2 py-0.5 text-[10px] font-bold rounded-full ${prenda.vendido ? 'bg-red-600 text-white' : 'bg-emerald-600 text-white'}">
                            ${prenda.vendido ? 'VENDIDO' : 'DISPONIBLE'}
                        </span>
                    </div>
                    <div class="p-3">
                        <div class="flex justify-between items-start gap-1">
                            <h3 class="font-bold text-sm text-gray-900 truncate">${prenda.nombre}</h3>
                            <div class="flex gap-1 shrink-0">
                                <span class="bg-purple-50 text-purple-700 text-[10px] font-bold px-1.5 py-0.5 rounded">${prenda.genero || 'N/A'}</span>
                                <span class="bg-indigo-50 text-indigo-700 text-[10px] font-bold px-1.5 py-0.5 rounded">${prenda.marca || 'Sin marca'}</span>
                            </div>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">Cat: ${prenda.categoria} | Talla: <span class="font-semibold text-gray-700">${prenda.talla}</span></p>
                        <p class="text-[11px] text-gray-400 mt-0.5">Estado: ${prenda.estado} | Cant: <span class="font-semibold text-gray-700">${prenda.cantidad || 1} ${prenda.unidadMedida || ''}</span></p>
                        <p class="text-[11px] text-gray-500 mt-0.5">Costo: <span class="font-semibold text-gray-700">$${(prenda.costo || 0).toLocaleString('es-CL')}</span></p>
                        ${seccionComentario}
                        <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-100">
                            <span class="text-base font-black text-indigo-600">$${prenda.precio.toLocaleString('es-CL')}</span>
                            <div>
                                ${!prenda.vendido ? `<button onclick="event.stopPropagation(); marcarVendido('${prenda._id}')" class="bg-red-500 hover:bg-red-600 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg transition">Vender</button>` : ''}
                            </div>
                        </div>
                    </div>
                `;
                contenedor.appendChild(tarjeta);
            });
        }
        window.abrirModalImagen = function(urlImagen) {
            document.getElementById('imagenModalAmpliada').src = urlImagen;
            document.getElementById('modalImagen').classList.remove('hidden');
        }
        window.cerrarModalImagen = function() {
            document.getElementById('modalImagen').classList.add('hidden');
            document.getElementById('imagenModalAmpliada').src = '';
        }
        window.abrirQrActual = function() {
            const id = document.getElementById('prendaId').value;
            const nombre = document.getElementById('nombre').value;
            if (!id) return;
            document.getElementById('qrTituloPrenda').innerText = nombre;
            document.getElementById('qrSubtitulo').innerText = 'Escanea para marcar como VENDIDO';
            
            const contenedorQr = document.getElementById('qrGeneradoModal');
            contenedorQr.innerHTML = ''; 
            const urlAccionVenta = `${window.location.origin}/prendas/${id}/vender`;
            new QRCode(contenedorQr, {
                text: urlAccionVenta,
                width: 180,
                height: 180,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
            document.getElementById('modalQr').classList.remove('hidden');
        }
        window.abrirQrAnularActual = function() {
            const id = document.getElementById('prendaId').value;
            const nombre = document.getElementById('nombre').value;
            if (!id) return;
            document.getElementById('qrTituloPrenda').innerText = nombre;
            document.getElementById('qrSubtitulo').innerText = 'Escanea para ANULAR venta';
            
            const contenedorQr = document.getElementById('qrGeneradoModal');
            contenedorQr.innerHTML = ''; 
            const urlAccionAnular = `${window.location.origin}/prendas/${id}/anular`;
            new QRCode(contenedorQr, {
                text: urlAccionAnular,
                width: 180,
                height: 180,
                colorDark: "#9333ea",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
            document.getElementById('modalQr').classList.remove('hidden');
        }
        window.cerrarModalQr = function() {
            document.getElementById('modalQr').classList.add('hidden');
        }
        window.mostrarDatosBloqueados = function(prenda) {
            llenarCamposFormulario(prenda);
            bloquearFormulario();
            document.getElementById('tituloFormulario').innerText = 'Detalle de Prenda';
            document.getElementById('btnHabilitarEdicion').classList.remove('hidden');
            document.getElementById('btnHabilitarEdicion').classList.add('flex');
            document.getElementById('btnBorrarPrenda').classList.remove('hidden');
            document.getElementById('btnBorrarPrenda').classList.add('flex');
            
            if (prenda.vendido) {
                document.getElementById('btnVerQr').classList.add('hidden');
                document.getElementById('btnVerQrAnular').classList.remove('hidden');
                document.getElementById('btnVerQrAnular').classList.add('flex');
            } else {
                document.getElementById('btnVerQr').classList.remove('hidden');
                document.getElementById('btnVerQr').classList.add('flex');
                document.getElementById('btnVerQrAnular').classList.add('hidden');
            }
            document.getElementById('btnGuardar').classList.add('hidden');
            document.getElementById('btnActualizar').classList.add('hidden');
            document.getElementById('btnCancelar').classList.add('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        window.habilitarNuevoIngreso = function() {
            document.getElementById('formPrenda').reset();
            document.getElementById('prendaId').value = '';
            document.getElementById('contenedorCodigoDisplay').classList.add('hidden');
            document.getElementById('previewMiniaturaContainer').classList.add('hidden');
            desbloquearFormulario();
            document.getElementById('tituloFormulario').innerText = '➕ Nuevo Ingreso de Prenda';
            document.getElementById('btnHabilitarEdicion').classList.add('hidden');
            document.getElementById('btnVerQr').classList.add('hidden');
            document.getElementById('btnVerQrAnular').classList.add('hidden');
            document.getElementById('btnBorrarPrenda').classList.add('hidden');
            document.getElementById('btnGuardar').classList.remove('hidden');
            document.getElementById('btnActualizar').classList.add('hidden');
            document.getElementById('btnCancelar').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        window.habilitarEdicionActual = function() {
            desbloquearFormulario();
            document.getElementById('tituloFormulario').innerText = '✏️ Editando Prenda';
            document.getElementById('btnHabilitarEdicion').classList.add('hidden');
            document.getElementById('btnVerQr').classList.add('hidden');
            document.getElementById('btnVerQrAnular').classList.add('hidden');
            document.getElementById('btnBorrarPrenda').classList.add('hidden');
            document.getElementById('btnGuardar').classList.add('hidden');
            document.getElementById('btnActualizar').classList.remove('hidden');
            document.getElementById('btnCancelar').classList.remove('hidden');
        }
        window.borrarPrendaActual = async function() {
            const id = document.getElementById('prendaId').value;
            const nombrePrenda = document.getElementById('nombre').value;
            if (!id) return;
            const confirmado = confirm(`¿Estás seguro de que deseas eliminar permanentemente la prenda "${nombrePrenda}"? Esta acción no se puede deshacer.`);
            if (!confirmado) return;
            try {
                const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert('Prenda eliminada correctamente del inventario.');
                    cancelarEdicion();
                    obtenerPrendas();
                } else {
                    alert('Error al intentar eliminar la prenda.');
                }
            } catch (error) {
                console.error("Error en la petición de borrado:", error);
                alert('Error de conexión con el servidor.');
            }
        };
        window.cancelarEdicion = function() {
            const idActual = document.getElementById('prendaId').value;
            if (idActual) {
                const prendaOriginal = listaGlobalPrendas.find(p => p._id === idActual);
                if (prendaOriginal) mostrarDatosBloqueados(prendaOriginal);
            } else {
                document.getElementById('formPrenda').reset();
                document.getElementById('prendaId').value = '';
                document.getElementById('contenedorCodigoDisplay').classList.add('hidden');
                document.getElementById('previewMiniaturaContainer').classList.add('hidden');
                bloquearFormulario();
                document.getElementById('tituloFormulario').innerText = 'Detalle de Prenda';
                document.getElementById('btnHabilitarEdicion').classList.add('hidden');
                document.getElementById('btnVerQr').classList.add('hidden');
                document.getElementById('btnVerQrAnular').classList.add('hidden');
                document.getElementById('btnBorrarPrenda').classList.add('hidden');
                document.getElementById('btnGuardar').classList.add('hidden');
                document.getElementById('btnActualizar').classList.add('hidden');
                document.getElementById('btnCancelar').classList.add('hidden');
            }
        }
        function llenarCamposFormulario(prenda) {
            document.getElementById('prendaId').value = prenda._id;
            document.getElementById('cantidad').value = prenda.cantidad || 1;
            document.getElementById('unidadSelect').value = prenda.unidadMedida || '';
            document.getElementById('nombre').value = prenda.nombre;
            document.getElementById('marcaSelect').value = prenda.marca;
            document.getElementById('genero').value = prenda.genero;
            document.getElementById('categoriaSelect').value = prenda.categoria;
            document.getElementById('tallaSelect').value = prenda.talla;
            document.getElementById('costo').value = prenda.costo || 0;
            document.getElementById('precio').value = prenda.precio;
            document.getElementById('estado').value = prenda.estado;
            document.getElementById('comentario').value = prenda.comentario || '';
            
            document.getElementById('codigoDisplay').innerText = prenda.codigo;
            document.getElementById('contenedorCodigoDisplay').classList.remove('hidden');
            if (prenda.imagen) {
                document.getElementById('imgFormPreview').src = prenda.imagen;
                document.getElementById('previewMiniaturaContainer').classList.remove('hidden');
            } else {
                document.getElementById('previewMiniaturaContainer').classList.add('hidden');
            }
        }
        function bloquearFormulario() {
            const campos = ['cantidad', 'unidadSelect', 'nombre', 'marcaSelect', 'genero', 'categoriaSelect', 'tallaSelect', 'costo', 'precio', 'estado', 'comentario', 'imagenFile'];
            campos.forEach(id => {
                const el = document.getElementById(id);
                el.disabled = true;
                el.className = el.className.replace(/bg-white text-gray-800 focus:ring-2 focus:ring-indigo-500/g, '') + ' bg-gray-100 text-gray-500';
            });
        }
        function desbloquearFormulario() {
            const campos = ['cantidad', 'unidadSelect', 'nombre', 'marcaSelect', 'genero', 'categoriaSelect', 'tallaSelect', 'costo', 'precio', 'estado', 'comentario', 'imagenFile'];
            campos.forEach(id => {
                const el = document.getElementById(id);
                el.disabled = false;
                el.className = el.className.replace(/bg-gray-100 text-gray-500/g, '') + ' bg-white text-gray-800 focus:ring-2 focus:ring-indigo-500';
            });
        }
        window.filtrarEstado = function(tipo) {
            filtroActual = tipo;
            document.querySelectorAll('.filtro-btn').forEach(btn => {
                btn.className = "filtro-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300 transition";
            });
            event.target.className = "filtro-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition";
            aplicarFiltros();
        }
        document.getElementById('inputBuscar').addEventListener('input', aplicarFiltros);
        document.getElementById('formPrenda').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('prendaId').value;
            if (id !== "") return;
            const formData = new FormData();
            formData.append('cantidad', document.getElementById('cantidad').value);
            formData.append('unidadMedida', document.getElementById('unidadSelect').value);
            formData.append('nombre', document.getElementById('nombre').value);
            formData.append('marca', document.getElementById('marcaSelect').value);
            formData.append('genero', document.getElementById('genero').value);
            formData.append('categoria', document.getElementById('categoriaSelect').value);
            formData.append('talla', document.getElementById('tallaSelect').value);
            formData.append('costo', document.getElementById('costo').value);
            formData.append('precio', document.getElementById('precio').value);
            formData.append('estado', document.getElementById('estado').value);
            formData.append('comentario', document.getElementById('comentario').value);
            
            const inputFile = document.getElementById('imagenFile').files[0];
            if (inputFile) formData.append('imagen', inputFile);
            try {
                const res = await fetch(API_URL, { method: 'POST', body: formData });
                if (res.ok) {
                    cancelarEdicion();
                    obtenerPrendas();
                } else {
                    alert('Error al guardar la prenda.');
                }
            } catch (error) { console.error("Error en la petición:", error); }
        });
        window.actualizarPrenda = async function() {
            const id = document.getElementById('prendaId').value;
            if (!id) return;
            const formData = new FormData();
            formData.append('cantidad', document.getElementById('cantidad').value);
            formData.append('unidadMedida', document.getElementById('unidadSelect').value);
            formData.append('nombre', document.getElementById('nombre').value);
            formData.append('marca', document.getElementById('marcaSelect').value);
            formData.append('genero', document.getElementById('genero').value);
            formData.append('categoria', document.getElementById('categoriaSelect').value);
            formData.append('talla', document.getElementById('tallaSelect').value);
            formData.append('costo', document.getElementById('costo').value);
            formData.append('precio', document.getElementById('precio').value);
            formData.append('estado', document.getElementById('estado').value);
            formData.append('comentario', document.getElementById('comentario').value);
            
            const inputFile = document.getElementById('imagenFile').files[0];
            if (inputFile) formData.append('imagen', inputFile);
            try {
                const res = await fetch(`${API_URL}/${id}`, { method: 'PUT', body: formData });
                if (res.ok) {
                    await obtenerPrendas();
                    const prendaActualizada = listaGlobalPrendas.find(p => p._id === id);
                    if (prendaActualizada) mostrarDatosBloqueados(prendaActualizada);
                } else {
                    alert('Error al actualizar la prenda.');
                }
            } catch (error) { console.error("Error en la petición:", error); }
        };
        async function marcarVendido(id) {
            try {
                const res = await fetch(`${API_URL}/${id}/vender`, { method: 'PUT' });
                if (res.ok) obtenerPrendas();
            } catch (error) { console.error(error); }
        }
        bloquearFormulario();
        inicializar();
    </script>
</body>
</html>
